name: browser-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest

    name: Chromium - P8.4 - L13.*

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo, sockets
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The browser plugin needs PHP 8.4 and Symfony 8, so it isn't in composer.json
      # (which still installs on PHP 8.2 and Laravel 12); it's added here instead.
      - name: Install dependencies
        run: |
          composer require --dev "pestphp/pest-plugin-browser:^5.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute browser tests
        run: vendor/bin/pest --testsuite=Browser --ci
