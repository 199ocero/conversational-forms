name: js

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    name: Vitest and prebuilt assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

      # The compiled assets in resources/dist ship with the Composer package,
      # so they must always match their sources.
      - name: Check prebuilt assets are up to date
        run: |
          npm run build
          git diff --exit-code -- resources/dist
